name: Admin Flutter APK

concurrency:
  group: admin-flutter-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - "apps/admin_mobile/**"
      - "supabase/functions/admin-email-otp/**"
      - "supabase/sql/**"
      - "supabase/migrations/**"
      - ".github/workflows/admin-flutter.yml"
  workflow_dispatch:

jobs:
  analyze-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/admin_mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform project
        run: flutter create --platforms=android --org com.suksescpns --project-name sukses_cpns_admin .
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Test
        run: flutter test
      - name: Build release APK
        run: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL=https://placeholder.supabase.co \
            --dart-define=SUPABASE_PUBLISHABLE_KEY=placeholder-public-key
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sukses-cpns-admin-apk
          path: apps/admin_mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
